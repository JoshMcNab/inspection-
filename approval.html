<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Quote Approval · Ultimate Automotive Works</title>
<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="approval.css?v=12">
</head>
<body>
<main class="approval-main"><section class="approval-card"><img src="logo.png?v=10" class="approval-logo" alt="Ultimate Automotive Works"><p class="eyebrow">CUSTOMER QUOTE APPROVAL</p><h1 id="approvalTitle">Loading quote…</h1><p id="approvalSub" class="muted"></p><div id="approvalStatus" class="approval-status"></div><div id="approvalItems" class="approval-items"></div><div id="approvalTotals" class="detail-card"></div><div id="approvalForm" class="approval-form hidden"><label>Your name<input id="customerApprovalName" placeholder="Customer name"></label><div class="signature-box"><p>Signature</p><canvas id="customerSig"></canvas><button type="button" class="secondary small" onclick="clearCustomerSig()">Clear</button></div><button class="primary big" onclick="submitApproval(true)">✓ Approve quote</button><button class="secondary big decline-button" onclick="submitApproval(false)">Decline quote</button><p class="approval-note">Your decision is recorded against the workshop job with a date and time.</p></div><p id="approvalMessage" class="approval-message"></p></section></main>
<script src="public-gateway.js?v=16"></script>
<script src="approval.js?v=16"></script>
</body>
</html>
